syntax = "proto3";
package market;

// Service boundary: consumers vendor this contract and generate their own bindings.
// Rust models, validation, storage and client implementations are private to each service.
// Catalog revision strings are opaque identities; pin them across pages and frames.
// Revisions must not be recomputed from a consumer's language-specific serialization.

// Services authenticate with signed node tokens issued by the hub CLI.
// Node identity is bound to its signature; no enrollment or credential registry.
// Bearer tokens use <node-id>.<signature>; node IDs are 1-64 ASCII letters/digits/_/-.
// Clients may derive their own ID from the prefix; only core verifies signatures.
// The hub signing secret is never a bearer credential. GUI clients use issued tokens too.

// Opaque identities. Exact decimal prices and Unix millisecond timestamps.
message Cursor {
  string generation = 1;
  uint64 revision = 2;
}

message Money {
  string currency_id = 1;
  string amount = 2;
}

enum RecordKind {
  RECORD_KIND_UNSPECIFIED = 0;
  RECORD_KIND_ITEM = 1;
  RECORD_KIND_ASK = 2;
  RECORD_KIND_BID = 3;
  RECORD_KIND_FEED = 4;
}

message RecordKey {
  string feed_id = 1;
  RecordKind kind = 2;
  string id = 3;
}

message Item {
  Observation observation = 1;
  ItemData data = 2;
}
message ItemData {
  string item_id = 1;
  map<string, AttributeValue> attributes = 2;
}

// Provenance shared by all typed market observations.
message Observation {
  string feed_id = 1;
  string item_type_id = 2;
  int64 observed_at_ms = 3;
}
message PriceQuantity {
  Money price = 1;
  // Positive exact amount; remaining on orders, executed on trades.
  string quantity = 2;
}
message Order {
  Observation observation = 1;
  OrderData data = 2;
}
message OrderData {
  string order_id = 1;
  PriceQuantity amounts = 2;
  optional int64 expires_at_ms = 3;
  // Opaque source annotations. 16 entries, 64-byte keys, 2048-byte values, 4096 combined UTF-8 bytes.
  map<string, string> meta = 4;
  oneof kind {
    string ask_item_id = 5;
    AttributeMap ask_units = 6;
    string bid_item_id = 7;
    Empty bid_any = 8;
    AttributeFilter bid_attributes = 9;
  }
}
message AttributeMap { map<string, AttributeValue> attributes = 1; }
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_ASK = 1;
  ORDER_SIDE_BID = 2;
}
// Feed and item type come from the observation envelope.
message OrderRef {
  string order_id = 1;
  OrderSide side = 2;
}
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_EXPIRED = 5;
}
message OrderStatusEvent {
  Observation observation = 1;
  OrderStatusData data = 2;
}
message OrderStatusData {
  string event_id = 1;
  OrderRef order = 2;
  OrderStatus status = 3;
  optional int64 occurred_at_ms = 4;
}
message OrderRemoval {
  Observation observation = 1;
  OrderRef data = 2;
}
message Trade {
  Observation observation = 1;
  TradeData data = 2;
}
message TradeData {
  string trade_id = 1;
  PriceQuantity amounts = 2;
  int64 executed_at_ms = 3;
  optional string buy_order_id = 4;
  optional string sell_order_id = 5;
  oneof kind {
    string item_id = 6;
    AttributeMap units = 7;
  }
}
// Adapters cannot submit core-owned observations/removals through this type.
message SourceEvent {
  oneof event {
    OrderStatusEvent order_status = 1;
    Trade trade = 2;
  }
}
// Canonical market events are retained once and delivered in publication order.
message MarketEvent {
  oneof event {
    Record upsert = 1;
    RecordKey delete = 2;
    OrderRemoval order_removed = 3;
    OrderStatusEvent order_status = 4;
    Trade trade = 5;
  }
}

// Explicit scalar types. Decimal values are exact strings; oneof preserves false and zero.
message AttributeValue {
  oneof value {
    string enum_id = 1;
    sint64 integer = 2;
    string decimal = 3;
    bool boolean = 4;
    string text = 5;
    int64 timestamp_ms = 6;
  }
}
message AttributeValues {
  repeated AttributeValue values = 1;
}
message AttributeRange {
  AttributeValue min = 1;
  AttributeValue max = 2;
}
message AttributePredicate {
  oneof predicate {
    AttributeValue eq = 1;
    AttributeValues one_of = 2;
    AttributeRange range = 3;
  }
}
message AttributeFilter {
  // AND across catalog attribute IDs. one_of gives OR within one attribute.
  // 1..64 predicates; one_of has 1..128 values. Ranges are inclusive.
  map<string, AttributePredicate> attributes = 1;
}

enum FeedState {
  FEED_STATE_UNSPECIFIED = 0;
  FEED_STATE_SYNCING = 1;
  FEED_STATE_READY = 2;
  FEED_STATE_STALE = 3;
  FEED_STATE_UNAVAILABLE = 4;
}

message FeedStatus {
  string feed_id = 1;
  string venue_id = 2;
  FeedState state = 3;
  optional int64 last_sync_ms = 4;
}

message Record {
  oneof record {
    Item item = 1;
    Order order = 2;
    FeedStatus feed = 3;
  }
}

message Mutation {
  oneof mutation {
    Record upsert = 1;
    RecordKey delete = 2;
  }
}

// Opaque, feed-scoped session IDs fence replaced writers and core restarts.
message OpenFeedRequest {
  string writer_id = 1;
  bool takeover = 2;
  string catalog_revision = 3;
}

// The feed ID is the authenticated node ID and is not echoed.
message OpenFeedResponse {
  string session_id = 1;
  string generation = 2;
  uint64 next_sequence = 3;
  bool requires_snapshot = 4;
  IngestLimits limits = 5;
}

message IngestLimits {
  uint32 max_batch_records = 1;
  uint32 max_entry_bytes = 2;
  uint32 max_payload_bytes = 3;
  uint32 max_message_bytes = 4;
  uint64 max_snapshot_records = 5;
  uint64 max_snapshot_bytes = 6;
  uint32 max_snapshot_chunks = 7;
  uint32 feed_lease_seconds = 8;
  uint32 upload_timeout_seconds = 9;
}

message FeedProgress {
  FeedState state = 1;
  optional int64 last_sync_ms = 2;
}

message RenewFeedRequest {
  string session_id = 1;
  // Omit to renew ownership without changing readiness or source freshness.
  FeedProgress progress = 2;
}

message PublishRequest {
  string session_id = 1;
  uint64 sequence = 2;
  repeated Mutation mutations = 3;
  // Explicit source trades/statuses, committed atomically with mutations.
  repeated SourceEvent events = 4;
  // Optional progress commits atomically with changes; counts as one batch entry.
  FeedProgress progress = 5;
}

// Trade events are durable before acknowledgement. Live state/replay remain generation-scoped RAM.
message PublishAck {
  Cursor cursor = 1;
  uint64 accepted_sequence = 2;
}

// First chunk carries session_id, snapshot_id and expected_sequence; later chunks carry only records.
// EOF commits the complete snapshot. First-header-only streams clear the feed. An interrupted stream publishes no records.
// Retry the entire identical upload with the same snapshot_id after a lost reply.
message SnapshotChunk {
  string session_id = 1;
  string snapshot_id = 2;
  // Reject a snapshot overtaken by a concurrent Publish. Snapshots do not consume sequences.
  uint64 expected_sequence = 3;
  repeated Record records = 4;
}

message Empty {}
message SyncRequest {
  // Omit for catalog/current-state snapshot followed by all ordered market events.
  // Invalid resume cursors fail explicitly; retry without after to resnapshot.
  Cursor after = 1;
}
enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_SNAPSHOT_START = 1;
  FRAME_KIND_SNAPSHOT_DATA = 2;
  FRAME_KIND_SNAPSHOT_COMPLETE = 3;
  FRAME_KIND_DELTA = 4;
  FRAME_KIND_CHECKPOINT = 5;
  FRAME_KIND_HEARTBEAT = 6;
}
// A snapshot's cursor/catalog/counts stay fixed through its complete marker.
// Delta chunks share one next cursor; apply their catalog and events atomically
// only when complete is true. Empty deltas still advance the global revision.
message SyncFrame {
  Cursor cursor = 1;
  FrameKind kind = 2;
  string catalog_revision = 3;
  repeated CatalogEntry catalog = 4;
  repeated Record records = 5;
  repeated MarketEvent events = 6;
  bool complete = 7;
  uint64 total_records = 8;
  uint64 record_bytes = 9;
}

// Immutable reference data. Fetch page zero without a generation, then pin all later pages.
message ExternalId {
  string namespace = 1;
  string id = 2;
}

message VenueDefinition {
  string id = 1;
  string name = 2;
}

message CurrencyDefinition {
  string id = 1;
  string name = 2;
  uint32 decimals = 3;
}

message ItemTypeDefinition {
  string id = 1;
  string name = 2;
  string quantity_step = 3;
  repeated ExternalId aliases = 4;
  map<string, AttributeRule> attributes = 5;
}
message AllowedAttributeValues { repeated string ids = 1; }
message AttributeRule {
  // Absence permits all enum options owned by the attribute; present must be nonempty.
  AllowedAttributeValues allowed_values = 1;
}
enum AttributeType {
  ATTRIBUTE_TYPE_UNSPECIFIED = 0;
  ATTRIBUTE_TYPE_ENUM = 1;
  ATTRIBUTE_TYPE_INTEGER = 2;
  ATTRIBUTE_TYPE_DECIMAL = 3;
  ATTRIBUTE_TYPE_BOOLEAN = 4;
  ATTRIBUTE_TYPE_TEXT = 5;
  ATTRIBUTE_TYPE_TIMESTAMP = 6;
}
message AttributeDefinition {
  string id = 1;

  string name = 2;
  AttributeType value_type = 3;
  AttributeValue minimum = 4;
  AttributeValue maximum = 5;
  optional uint32 max_length = 6;
}
message AttributeValueDefinition {
  string id = 1;
  string attribute_id = 2;
  string name = 3;
  repeated ExternalId aliases = 4;
  // Opaque source annotations. Source-specific concepts belong here.
  map<string, string> meta = 5;
}

message FeedDefinition {
  string id = 1;
  string venue_id = 2;
}

message CatalogEntry {
  oneof entry {
    VenueDefinition venue = 1;
    CurrencyDefinition currency = 2;
    ItemTypeDefinition item_type = 3;
    AttributeDefinition attribute = 4;
    AttributeValueDefinition attribute_value = 5;
    FeedDefinition feed = 6;
  }
}

// Generic, namespace-owned catalog bundles. One collection per bundle is conventional.
// Updates merge definitions: omissions never retire IDs or remove allowed values.
message CatalogBundle {
  string id = 1;
  repeated CatalogEntry entries = 2;
}
// First chunk carries update_id and expected_revision; later chunks carry only bundles.
// EOF commits atomically; incomplete streams are discarded. Retry identical content
// and identity after a lost reply. At most 500 entries / 512 KiB per chunk,
// 4096 chunks, 100000 entries / 32 MiB per complete catalog upload.
message CatalogChunk {
  string update_id = 1;
  string expected_revision = 2;
  repeated CatalogBundle bundles = 3;
}
message CatalogCommit {
  string revision = 1;
}
service MarketAdapter {
  rpc ConfigureCatalog(stream CatalogChunk) returns (CatalogCommit);
  rpc OpenFeed(OpenFeedRequest) returns (OpenFeedResponse);
  rpc RenewFeed(RenewFeedRequest) returns (PublishAck);
  rpc Publish(PublishRequest) returns (PublishAck);
  rpc ReplaceSnapshot(stream SnapshotChunk) returns (PublishAck);
}

message ReadMeta {
  Cursor cursor = 1;
  string catalog_revision = 2;
  string served_at = 3; // UTC RFC 3339.
  string as_of = 4;
}
message Page { optional string next_cursor = 1; }
message Included {
  repeated Item items = 1;
  repeated FeedStatus feeds = 2;
}
message ReadStatus {
  bool ready = 1;
  uint64 records = 2;
  uint32 feeds = 3;
  uint32 ready_feeds = 4;
  ReadMeta meta = 5;
  uint64 record_bytes = 6;
  uint64 replay_batches = 7;
  uint64 replay_bytes = 8;
  uint64 inflight_requests = 9;
  uint64 pending_bytes = 10;
  Cursor oldest_cursor = 11;
  string started_at = 12; // UTC RFC 3339.
}
message CatalogQuery {
  optional string kind = 1;
  optional string id = 2;
  optional string item_type_id = 3;
  optional string attribute_id = 4;
  optional string q = 5;
  optional uint32 limit = 6;
  optional string cursor = 7;
}
message CatalogResult {
  repeated CatalogEntry data = 1;
  Page page = 2;
  ReadMeta meta = 3;
}
message FeedsQuery { optional string feed_id = 1; }
message FeedsResult { repeated FeedStatus data = 1; ReadMeta meta = 2; }
message ItemsQuery {
  optional string feed_id = 1;
  optional string item_type_id = 2;
  optional string item_id = 3;
  AttributeMap attributes = 4;
  optional uint32 limit = 5;
  optional string cursor = 6;
}
message ItemsResult { repeated Item data = 1; Page page = 2; ReadMeta meta = 3; }
message OrdersQuery {
  optional string item_type_id = 1;
  optional string currency_id = 2;
  optional OrderSide side = 3;
  optional string feed_id = 4;
  optional string item_id = 5;
  optional string order_id = 6;
  AttributeMap attributes = 7;
  optional string price_min = 8;
  optional string price_max = 9;
  optional uint32 limit = 10;
  optional string cursor = 11;
  bool include_items = 12;
  bool include_feeds = 13;
}
message OrdersResult {
  repeated Order data = 1;
  Page page = 2;
  ReadMeta meta = 3;
  Included included = 4;
}
message BookQuery {
  string item_type_id = 1;
  string currency_id = 2;
  optional string feed_id = 3;
  optional string item_id = 4;
  AttributeMap attributes = 5;
  optional string price_min = 6;
  optional string price_max = 7;
  optional uint32 limit = 8;
  bool include_items = 9;
  bool include_feeds = 10;
}
message BookSidePage { repeated Order data = 1; Page page = 2; }
message BookResult {
  string item_type_id = 1;
  string currency_id = 2;
  BookSidePage asks = 3;
  BookSidePage bids = 4;
  ReadMeta meta = 5;
  Included included = 6;
}
message TradesQuery {
  optional string feed_id = 1;
  optional string item_type_id = 2;
  optional string currency_id = 3;
  optional string item_id = 4;
  optional string executed_from = 5; // UTC RFC 3339.
  optional string executed_until = 6;
  optional uint32 limit = 7;
  optional string cursor = 8;
}
message TradesResult {
  repeated Trade data = 1;
  Page page = 2;
  ReadMeta meta = 3;
}
// Authenticated nodes are trusted services: all may read and write their own namespace.
// Catalog continuations pin catalog revision and filters independently of live view TTL.
// Shared-state reads run independently of the writer. History is durable; live books are rebuilt.
service MarketRead {
  rpc GetStatus(Empty) returns (ReadStatus);
  rpc ListCatalog(CatalogQuery) returns (CatalogResult);
  rpc ListFeeds(FeedsQuery) returns (FeedsResult);
  rpc ListItems(ItemsQuery) returns (ItemsResult);
  rpc ListOrders(OrdersQuery) returns (OrdersResult);
  // Raw storage order, including unavailable feeds and expired orders. Supports
  // side/feed/type/currency/order ID and limit/cursor; other filters are rejected.
  rpc ListStoredOrders(OrdersQuery) returns (OrdersResult);
  rpc GetOrderBook(BookQuery) returns (BookResult);
  rpc ListTrades(TradesQuery) returns (TradesResult);
  // Initial full view, then complete replacements.
  rpc WatchOrderBook(BookQuery) returns (stream BookResult);
  rpc Sync(SyncRequest) returns (stream SyncFrame);
  // Up to ten retained revisions, then a checkpoint and EOF. Omitted after starts
  // at the replay floor. Resume from the last complete checkpoint to page/poll.
  rpc Replay(SyncRequest) returns (stream SyncFrame);
}
