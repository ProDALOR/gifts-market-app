syntax = "proto3";
package market;

// All decimals are exact strings; times are UTC epoch milliseconds on the wire.
message Empty {}
enum OrderMode {
  ORDER_MODE_UNSPECIFIED = 0;
  ORDER_MODE_ASK = 1;
  ORDER_MODE_BID = 2;
  ORDER_MODE_EXECUTED = 3;
}
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_VENUE = 1;
  ENTITY_KIND_CURRENCY = 2;
  ENTITY_KIND_ITEM_TYPE = 3;
  ENTITY_KIND_ATTRIBUTE = 4;
  ENTITY_KIND_ATTRIBUTE_OPTION = 5;
  ENTITY_KIND_FEED = 6;
  ENTITY_KIND_ORDER = 7;
}
// venue_id is required only for orders. Order keys stay stable across modes.
message Key {
  EntityKind kind = 1;
  string id = 2;
  string venue_id = 3;
}
// Lists are ordered and retain duplicates. Object keys reference catalog field schemas.
message AttributeValue {
  oneof value {
    string option_id = 1;
    sint64 integer = 2;
    string decimal = 3;
    bool boolean = 4;
    string text = 5;
    int64 timestamp_ms = 6;
    AttributeValues list = 7;
    AttributeObject object = 8;
  }
}
message AttributeValues {
  repeated AttributeValue values = 1;
}
message AttributeObject {
  map<string, AttributeValue> fields = 1;
}
message AttributeRange {
  AttributeValue min = 1;
  AttributeValue max = 2;
}
message AttributePredicate {
  oneof predicate {
    AttributeValue eq = 1;
    AttributeValues one_of = 2;
    AttributeRange range = 3;
    ObjectPredicate object = 4;
    ContainsPredicate contains = 5;
    AttributePredicates all_of = 6;
  }
}
// Partial constraints that must hold on the same object occurrence.
message ObjectPredicate {
  map<string, AttributePredicate> fields = 1;
}
// Count list occurrences matching predicate, including identical repeated entries.
message ContainsPredicate {
  AttributePredicate predicate = 1;
  // Omitted minimum means one. Zero is valid, for example min=0/max=0.
  optional uint32 min_count = 2;
  optional uint32 max_count = 3;
}
// Every predicate must match the same value. List counts are evaluated independently.
message AttributePredicates {
  repeated AttributePredicate predicates = 1;
}
// Asks and executions allow equality predicates only. Empty filter means any for bids.
// Item identity and attributes are local to this order. Executed facts are immutable.
// One identity (book.venue_id, id) across modes and book changes.
// Quantity means remaining or executed. Price is an exact decimal in book.currency_id.
// Executed mode requires executed_at_ms; asks and bids omit execution fields.
message Order {
  string id = 1;
  BookKey book = 2;
  int64 observed_at_ms = 3;
  OrderMode mode = 4;
  optional string item_id = 5;
  map<string, AttributePredicate> attributes = 6;
  string price = 7;
  string quantity = 8;
  optional int64 expires_at_ms = 9;
  map<string, string> meta = 10;
  optional int64 executed_at_ms = 11;
  // Original order ID when an execution uses a distinct record ID (for example a partial fill).
  optional string parent_order_id = 12;
}
message ExternalId {
  string namespace = 1;
  string id = 2;
}
message Venue {
  string id = 1;
  string name = 2;
}
message Currency {
  string id = 1;
  string name = 2;
  uint32 decimals = 3;
}
message AllowedAttributeValues {
  repeated string ids = 1;
}
message AttributeRule {
  AllowedAttributeValues allowed_values = 1;
  bool required = 2;
}
message ItemType {
  string id = 1;
  string name = 2;
  string quantity_step = 3;
  repeated ExternalId aliases = 4;
  map<string, AttributeRule> attributes = 5;
}
enum AttributeType {
  ATTRIBUTE_TYPE_UNSPECIFIED = 0;
  ATTRIBUTE_TYPE_ENUM = 1;
  ATTRIBUTE_TYPE_INTEGER = 2;
  ATTRIBUTE_TYPE_DECIMAL = 3;
  ATTRIBUTE_TYPE_BOOLEAN = 4;
  ATTRIBUTE_TYPE_TEXT = 5;
  ATTRIBUTE_TYPE_TIMESTAMP = 6;
  ATTRIBUTE_TYPE_LIST = 7;
  ATTRIBUTE_TYPE_OBJECT = 8;
}
message Attribute {
  string id = 1;
  string name = 2;
  AttributeType value_type = 3;
  AttributeValue minimum = 4;
  AttributeValue maximum = 5;
  // UTF-8 bytes for text; entry count for lists.
  optional uint32 max_length = 6;
  // List element schema and object field schemas use catalog Attribute IDs.
  optional string element = 7;
  map<string, AttributeRule> fields = 8;
}
message AttributeOption {
  string id = 1;
  string attribute_id = 2;
  string name = 3;
  repeated ExternalId aliases = 4;
  map<string, string> meta = 5;
}
// Scopes select orders only. Empty modes mean every order mode.
// Attribute filters match concrete ask/execution facts carried in Order.attributes.
message Scope {
  optional string venue_id = 1;
  optional string item_type_id = 2;
  // Quote currency. Omitted means all currencies; a book selects one item type and currency.
  optional string currency_id = 3;
  repeated OrderMode modes = 4;
  map<string, AttributePredicate> attributes = 5;
  PriceRange price = 6;
}
// Inclusive exact bounds in the scope's single quote currency.
message PriceRange {
  optional string min = 1;
  optional string max = 2;
}
// Concrete venue book. Unified views filter item type/currency without fixing a venue.
message BookKey {
  string venue_id = 1;
  string item_type_id = 2;
  string currency_id = 3;
}
message Feed {
  string id = 1;
  repeated BookKey books = 2;
  // Empty modes select all modes. Attributes constrain facts within every referenced book.
  repeated OrderMode modes = 3;
  map<string, AttributePredicate> attributes = 4;
  optional int64 last_verified_at_ms = 5;
}
message Entity {
  oneof entity {
    Venue venue = 1;
    Currency currency = 2;
    ItemType item_type = 3;
    Attribute attribute = 4;
    AttributeOption attribute_option = 5;
    Feed feed = 6;
    Order order = 7;
  }
}
message Removal {
  Key key = 1;
  // Optional on ingress: Publish defaults to observation start; catalog edits use commit time.
  // Watch removals always include a concrete time. Supplied times must be valid.
  optional int64 observed_at_ms = 2;
}
// One mutation format on ingress and Watch. Executed orders are immutable upserts.
message Change {
  oneof change {
    Entity upsert = 1;
    Removal remove = 2;
  }
}
// One bundle per stream; only the first chunk carries bundle_id. EOF commits atomically.
// Upserts replace complete definitions. Only explicit removals delete entries; an empty upload is a no-op.
// Orders use Publish. Catalog removal times may be omitted; Watch uses hub commit time.
message CatalogChunk {
  string bundle_id = 1;
  repeated Change changes = 2;
}
message FeedRequest {
  string feed_id = 1;
}
// Acquire before source requests. Tokens are opaque and bound to writer/feed/restart.
message Observation {
  string token = 1;
  string history_id = 2;
}
message PublishRequest {
  string observation_token = 1;
  repeated Change changes = 2;
}
message VerifyFeedRequest {
  string observation_token = 1;
}
// Execution-time bounds: inclusive from, exclusive until. Either bound may be omitted.
message Period {
  optional int64 from_ms = 1;
  optional int64 until_ms = 2;
}
message Selection {
  // Empty kinds/keys mean all. Both filters intersect the source projection.
  repeated EntityKind kinds = 1;
  // Exact entity identities, including venue_id for orders; never item IDs.
  repeated Key keys = 2;
  // Omitted source selects all entities; an explicit empty scope selects all orders.
  // Both feed and scope sources select orders only, narrowed by kinds/keys.
  // Read/watch feed definitions and verification metadata using ordinary feed keys without a source.
  oneof source {
    string feed_id = 3;
    Scope scope = 4;
  }
  // When present, select executed orders only.
  Period executed_at = 5;
}
enum ReadMode {
  // Return exactly one page, then close. Continuations retain the same snapshot and Watch cursor.
  READ_MODE_SNAPSHOT = 0;
  // Return a live page, then replacements including refills. Reconnect with the same request.
  READ_MODE_LIVE = 1;
}
enum ReadSort {
  READ_SORT_IDENTITY = 0;
  READ_SORT_PRICE_ASC = 1;
  READ_SORT_PRICE_DESC = 2;
}
// Follow snapshot continuations until empty, then Watch at the page cursor.
// Active paging renews the idle view lifetime. A full replica can use an omitted selection:
// open Watch at the first page cursor while paging, buffer changes, then apply them after the snapshot.
// Retained snapshot views expire and are lost on restart; LIVE can still use their boundary.
// A shared continuation binds client, selection and sort. LIVE uses its position only.
// SNAPSHOT continues its retained view, or opens a new view at a LIVE continuation's position.
// Price ties use venue/order identity; descending reverses the whole key.
// Identity reads put current entities first, then executions by time, venue, ID.
message ReadRequest {
  Selection selection = 1;
  uint32 limit = 2;
  string page_token = 3;
  ReadMode mode = 4;
  // Price sorting requires current orders in one item type and quote currency.
  ReadSort sort = 5;
}
message Page {
  repeated Entity entities = 1;
  string next_page_token = 2;
  // Selection checkpoint for Watch; not a pagination token or a visible-page-only delta filter.
  string cursor = 3;
}
// Omit after_cursor to subscribe from now; supply a Watch/Page cursor for replay/resume.
message WatchRequest {
  Selection selection = 1;
  string after_cursor = 2;
}
// Apply each delivery, then save its cursor. One atomic write may span several batches.
// An empty batch is a checkpoint/heartbeat, including the subscription acknowledgement.
message Batch {
  string cursor = 1;
  repeated Change changes = 2;
}
// Live keyset directory, ordered by venue, item type and currency. Not a retained snapshot.
message BooksRequest {
  BookKey after = 1;
  uint32 limit = 2;
}
message BooksPage {
  repeated BookKey books = 1;
  BookKey next_after = 2;
}
service MarketWrite {
  rpc ConfigureCatalog(stream CatalogChunk) returns (Empty);
  rpc ObserveFeed(FeedRequest) returns (Observation);
  // Success confirms acceptance; read/watch checkpoints belong to MarketRead.
  rpc Publish(PublishRequest) returns (Empty);
  // Call only after successfully enumerating and confirming every page in the feed.
  rpc VerifyFeed(VerifyFeedRequest) returns (Empty);
}
// Coordinated exports pin current entities and history at one Watch checkpoint.
// Tokens are private to the authenticated owner. Close is idempotent; abandoned
// sessions expire. Both parts must finish before a consumer publishes the dataset.
message SnapshotSession {
  string token = 1;
  string cursor = 2;
}
enum SnapshotPart {
  SNAPSHOT_PART_CURRENT = 0;
  SNAPSHOT_PART_HISTORY = 1;
}
message SnapshotPartRequest {
  string token = 1;
  SnapshotPart part = 2;
}
message SnapshotToken { string token = 1; }
service MarketRead {
  rpc OpenSnapshot(Empty) returns (SnapshotSession);
  // Each part may be started once. next_page_token is a nonempty marker until
  // the final frame, not a token for Read. All frames share the session cursor.
  rpc ReadSnapshotPart(SnapshotPartRequest) returns (stream Page);
  rpc CloseSnapshot(SnapshotToken) returns (Empty);

  // Includes feed-declared books and books with active orders. Feed removal never deletes orders.
  rpc Books(BooksRequest) returns (BooksPage);
  // SNAPSHOT returns one page and closes; LIVE streams replacements of the selected page.
  // LIVE boundaries survive reconnect/restart with the same signing secret and selection.
  rpc Read(ReadRequest) returns (stream Page);
  rpc Watch(WatchRequest) returns (stream Batch);
}
