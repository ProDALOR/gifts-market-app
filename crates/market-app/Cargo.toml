[package]
name = "market-app"
version.workspace = true
edition.workspace = true
[[bin]]
name = "market-app"
path = "src/main.rs"

[dependencies]
market-api.workspace = true
market-actors.workspace = true
market-hub-client.workspace = true
market-replica.workspace = true
market-telegram = { workspace = true, optional = true }
market-miniapp = { workspace = true, optional = true }
futures-util.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
[features]
default = []
bot = ["dep:market-telegram"]
miniapp = ["dep:market-miniapp", "market-api/miniapp"]
[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio-tungstenite = "0.29"
[lints]
workspace = true
