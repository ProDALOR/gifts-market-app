[package]
name = "market-app"
version.workspace = true
edition.workspace = true
[[bin]]
name = "market-app"
path = "src/main.rs"

[dependencies]
market-invocations = { workspace = true, optional = true }
market-media.workspace = true
market-api.workspace = true
market-actors.workspace = true
market-hub-client.workspace = true
market-replica.workspace = true
market-telegram = { workspace = true, optional = true }
market-telegram-bot = { workspace = true, optional = true }
market-miniapp = { workspace = true, optional = true }
futures-util.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
[features]
default = []
bot = ["dep:market-invocations", "dep:market-telegram", "dep:market-telegram-bot"]
miniapp = ["dep:market-miniapp", "market-api/miniapp"]
[dev-dependencies]
market-hub-protocol.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
jiff.workspace = true
