[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
market-gifts = { path = "crates/market-gifts" }
market-gifts-hub = { path = "crates/market-gifts-hub" }
flate2 = "1"
market-media = { path = "crates/market-media" }
market-api = { path = "crates/market-api", default-features = false }
market-actors = { path = "crates/market-actors" }
market-miniapp = { path = "crates/market-miniapp" }
market-hub-protocol = { path = "crates/market-hub-protocol" }
market-hub-client = { path = "crates/market-hub-client" }
market-replica = { path = "crates/market-replica" }
market-telegram = { path = "crates/market-telegram" }
ed25519-dalek = "3"
getrandom = "0.4"
hmac = "0.12"
percent-encoding = "2"
grammers-client = "=0.12.0"
grammers-session = "=0.12.0"
url = "2"
redb = "4.6"
im = "15"
rust_decimal = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
actix = "0.13.5"
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.4"
actix-cors = "0.7"
futures-util = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["actix_extras", "rc_schema"] }

[workspace.lints.rust]
unsafe_code = "forbid"
