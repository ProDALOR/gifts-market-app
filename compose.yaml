name: market-app

services:
  market-app:
    image: ${MARKET_APP_IMAGE:-market-app:local}
    build:
      context: .
      target: market-app
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    tmpfs: ["/tmp:size=16m,mode=1777,nosuid,nodev"]
    networks: [market]
    command: [--bind, "0.0.0.0:8080"]
    environment:
      MARKET_CORE_URL: ${MARKET_CORE_URL:-http://market-hub:50051}
      MARKET_NODE_TOKEN: ${MARKET_NODE_TOKEN:?Set MARKET_NODE_TOKEN to an issued service token}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${MARKET_API_PORT:-8080}:8080"

networks:
  market:
    name: ${MARKET_NETWORK:-market}
    external: true
