name: market-app

services:
  market-app:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    tmpfs: ["/tmp:size=16m,mode=1777,nosuid,nodev"]
    volumes:
      - market-app-data:/data
      - market-bot-data:/bot-data
      - type: bind
        source: ./accounts.json
        target: /app/accounts.json
        read_only: true
        bind:
          create_host_path: false
    env_file: .env
    environment:
      MARKET_HUB_URL: ${MARKET_HUB_URL:?Set MARKET_HUB_URL to a reachable hub address}
      MARKET_HUB_TOKEN: ${MARKET_HUB_TOKEN:?Set MARKET_HUB_TOKEN to an issued service token}
      # Container paths take precedence over native settings in .env.
      MARKET_DATA_DIR: /data
      MARKET_BOT_DATA_DIR: /bot-data
      MARKET_MEDIA_DIR: /data/media
      MARKET_WEB_DIR: /app/web/dist
    ports:
      - "${MARKET_APP_PORT:-8080}:8080"

networks:
  default:
    name: ${MARKET_NETWORK:-market}
    external: true

volumes:
  market-app-data:
  market-bot-data:
