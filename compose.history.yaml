name: market-history

services:
  history-node:
    image: ${MARKET_HISTORY_IMAGE:-market-history:local}
    build:
      context: .
      target: history-node
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    tmpfs: ["/tmp:size=16m,mode=1777,nosuid,nodev"]
    networks: [market]
    command: [--core-ca, /run/secrets/market_ca, --credentials, /var/lib/market/node/identity.json, --output, /var/lib/market/history]
    secrets: [market_ca]
    environment:
      MARKET_CORE_URL: ${MARKET_CORE_URL:-https://market-hub:50052}
      MARKET_REGISTRATION_TOKEN: ${MARKET_REGISTRATION_TOKEN:?Run sh docker/setup.sh with the hub join bundle}
    volumes:
      - history-identity:/var/lib/market/node
      - history-store:/var/lib/market/history

networks:
  market:
    name: ${MARKET_NETWORK:-market}
    external: true

volumes:
  history-identity:
  history-store:

secrets:
  market_ca:
    file: ${MARKET_HUB_CA:-./.docker/hub-ca.crt}
